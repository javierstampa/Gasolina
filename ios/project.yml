name: GasAll
options:
  bundleIdPrefix: com.javierstampa
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  GasAll:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - GasAll
    info:
      path: GasAll/Info.plist
      properties:
        CFBundleDisplayName: GasAll
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: Tu ubicación se usa solo para encontrar las gasolineras más cercanas.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.javierstampa.gasall
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
schemes:
  GasAll:
    build:
      targets:
        GasAll: all
    run:
      config: Debug
