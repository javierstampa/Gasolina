name: Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml

      - name: Build (unsigned)
        run: |
          xcodebuild -project ios/GasAll.xcodeproj \
            -scheme GasAll \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/GasAll.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr GasAll.ipa Payload
          ls -la GasAll.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GasAll-ipa
          path: GasAll.ipa
          if-no-files-found: error
