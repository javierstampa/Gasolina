name: test-miteco

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Curl MITECO
        run: |
          code=$(curl -s -o /tmp/m.json -w "%{http_code}" -m 90 -A "Mozilla/5.0" -H "Accept: application/json" "https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes/EstacionesTerrestres/")
          echo "HTTP_CODE=$code"
          echo "SIZE=$(wc -c < /tmp/m.json)"
          head -c 300 /tmp/m.json
      - name: Curl MIMIT Italia
        run: |
          code=$(curl -s -o /tmp/it.csv -w "%{http_code}" -m 90 -A "Mozilla/5.0" "https://www.mimit.gov.it/images/exportCSV/anagrafica_impianti_attivi.csv")
          echo "HTTP_CODE=$code"
          echo "SIZE=$(wc -c < /tmp/it.csv)"
